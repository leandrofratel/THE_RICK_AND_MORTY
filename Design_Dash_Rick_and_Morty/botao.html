<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0d1117;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .btn-iniciar {
      position: relative;
      padding: 16px 48px;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #0d1117;
      background: linear-gradient(145deg, #2b5a4c, #1d3b32);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.2s ease;
      box-shadow: 
        0 8px 0 #0f1f1a,
        inset 0 -3px 0 rgba(0,0,0,0.4),
        inset 0 0 20px rgba(0, 255, 200, 0.15);
      z-index: 1;
      transform: perspective(500px) rotateX(2deg);
    }

    /* Camada metálica cibernética */
    .btn-iniciar::before {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: 27px;
      background: linear-gradient(135deg, 
        #b8a45c 0%,   /* dourado claro */
        #f5e56b 20%, 
        #6b7a3a 50%,  /* verde oliva cibernético */
        #2e5e5a 70%,  /* azul esverdeado */
        #1f8a7a 100%
      );
      background-size: 200% 200%;
      background-position: 0% 0%;
      z-index: -1;
      opacity: 0.9;
      transition: 0.4s ease;
      box-shadow: 
        inset 0 0 12px rgba(212, 255, 0, 0.3),
        0 0 15px rgba(0, 255, 200, 0.2);
    }

    /* Efeito de aço escovado / ranhuras cibernéticas */
    .btn-iniciar::after {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 24px;
      background: repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0px,
        rgba(255, 255, 255, 0.03) 2px,
        rgba(0, 0, 0, 0.1) 4px,
        rgba(255, 255, 255, 0) 6px
      );
      pointer-events: none;
      z-index: 0;
    }

    /* Texto com brilho interno */
    .btn-iniciar span {
      position: relative;
      z-index: 2;
      background: linear-gradient(180deg, #f7f3d9 20%, #b8a45c 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 10px rgba(210, 255, 0, 0.4);
      font-family: 'Orbitron', 'Segoe UI', monospace;
    }

    /* Efeito hover – brilho e movimento cibernético */
    .btn-iniciar:hover {
      transform: perspective(500px) rotateX(0deg) scale(1.02);
      box-shadow: 
        0 8px 0 #0f1f1a,
        inset 0 -3px 0 rgba(0,0,0,0.4),
        0 0 30px rgba(0, 255, 200, 0.4);
    }

    .btn-iniciar:hover::before {
      background-position: 100% 100%;
      filter: brightness(1.3);
      box-shadow: 
        inset 0 0 25px rgba(255, 215, 0, 0.5),
        0 0 30px rgba(0, 255, 200, 0.4);
    }

    /* Pressionado (ativo) */
    .btn-iniciar:active {
      transform: perspective(500px) rotateX(2deg) scale(0.96);
      box-shadow: 
        0 2px 0 #0f1f1a,
        inset 0 -1px 0 rgba(0,0,0,0.4);
    }

    /* Pequeno detalhe de "circuito" piscante */
    .btn-iniciar .pulse {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #7affcf;
      border-radius: 50%;
      top: 8px;
      right: 14px;
      box-shadow: 0 0 12px #00ffc8;
      animation: blink 1.2s infinite;
      z-index: 3;
      opacity: 0.7;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Fonte opcional (Orbitron para vibe sci-fi) */
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap');
  </style>
</head>
<body>

  <button class="btn-iniciar">
    <span>INICIAR</span>
    <div class="pulse"></div>
  </button>

</body>
</html>
