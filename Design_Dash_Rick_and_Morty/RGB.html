<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Paleta de Cores</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: grid;
      grid-template-columns: repeat(3, 200px);
      gap: 20px;
      padding: 20px;
    }

    .color-box {
      height: 150px;
      border-radius: 8px;
      display: flex;
      align-items: end;
      justify-content: center;
      padding: 10px;
      color: white;
      font-weight: bold;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <div class="color-box" style="background:#28615b">#28615b</div>
  <div class="color-box" style="background:#a7812c">#a7812c</div>
  <div class="color-box" style="background:#94a29d">#94a29d</div>
  <div class="color-box" style="background:#687b68">#687b68</div>
  <div class="color-box" style="background:#c0cbbc">#c0cbbc</div>
  <div class="color-box" style="background:#d0ccb2">#d0ccb2</div>
  <div class="color-box" style="background:#82deea">#82deea</div>
  <div class="color-box" style="background:#957950">#957950</div>
  <div class="color-box" style="background:#86c794">#86c794</div>
  <div class="color-box" style="background:#697c53">#697c53</div>
  <div class="color-box" style="background:#e1e0c6">#e1e0c6</div>
  <div class="color-box" style="background:#b0c0b3">#b0c0b3</div>
</body>
</html>
