<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Paleta Rick Cyber Implants</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      /* background: #111; */
      background: #ffffff;
      color: white;
      display: grid;
      grid-template-columns: repeat(3, 220px);
      gap: 20px;
      padding: 30px;
      justify-content: center;
    }

    .color-box {
      height: 160px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: end;
      align-items: center;
      padding: 12px;
      border: 2px solid rgba(255,255,255,.15);
      /* box-shadow: 0 4px 10px rgba(0,0,0,.4); */
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      font-weight: bold;
      text-shadow: 1px 1px 3px rgba(0,0,0,.6);
    }

    .label {
      background: rgba(0,0,0,.35);
      padding: 6px 10px;
      border-radius: 6px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- verdes -->
  <div class="color-box" style="background:#687b68">
    <div class="label">#687b68</div>
    <div class="label">Verde metálico</div>
  </div>

  <div class="color-box" style="background:#697c53">
    <div class="label">#697c53</div>
    <div class="label">Verde oliva</div>
  </div>

  <div class="color-box" style="background:#6f8f77">
    <div class="label">#6f8f77</div>
    <div class="label">Verde highlight</div>
  </div>

  <div class="color-box" style="background:#4f6d52">
    <div class="label">#4f6d52</div>
    <div class="label">Verde sombra</div>
  </div>

  <div class="color-box" style="background:#28615b">
    <div class="label">#4f6d52</div>
    <div class="label">Verde sombra</div>
  </div>

  <!-- dourados -->
  <div class="color-box" style="background:#a7812c">
    <div class="label">#a7812c</div>
    <div class="label">Dourado base</div>
  </div>

  <div class="color-box" style="background:#957950">
    <div class="label">#957950</div>
    <div class="label">Bronze sombra</div>
  </div>

  <div class="color-box" style="background:#d2b44c">
    <div class="label">#d2b44c</div>
    <div class="label">Ouro brilho</div>
  </div>

  <!-- azuis -->
  <div class="color-box" style="background:#82deea; color:black;">
    <div class="label">#82deea</div>
    <div class="label">Ciano energia</div>
  </div>

  <div class="color-box" style="background:#63e8ff; color:black;">
    <div class="label">#63e8ff</div>
    <div class="label">Portal glow</div>
  </div>

  <div class="color-box" style="background:#dffcff; color:black;">
    <div class="label">#dffcff</div>
    <div class="label">Azul gelo</div>
  </div>

  <!-- neutros -->
  <div class="color-box" style="background:#c0cbbc; color:black;">
    <div class="label">#c0cbbc</div>
    <div class="label">Metal claro</div>
  </div>

  <div class="color-box" style="background:#e1e0c6; color:black;">
    <div class="label">#e1e0c6</div>
    <div class="label">Reflexo</div>
  </div>

</body>
</html>
